<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Record Editor - Note Pin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed": "#ffdbcd",
                        "on-primary-fixed": "#00174b",
                        "on-tertiary-fixed": "#360f00",
                        "secondary": "#505f76",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fb",
                        "primary-container": "#2563eb",
                        "surface-variant": "#e0e3e5",
                        "error": "#ba1a1a",
                        "tertiary": "#943700",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface": "#f7f9fb",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef0",
                        "secondary-container": "#d0e1fb",
                        "inverse-surface": "#2d3133",
                        "on-primary-container": "#eeefff",
                        "surface-container-highest": "#e0e3e5",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-container": "#54647a",
                        "primary": "#004ac6",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-tint": "#0053db",
                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "background": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface-variant": "#434655",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadc",
                        "tertiary-container": "#bc4800",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-high": "#e6e8ea"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-desktop": "40px",
                        "md": "16px",
                        "xs": "4px",
                        "base": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
        
        /* Custom scrollbar for minimalist look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #e0e3e5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #c3c6d7; }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col md:flex-row light">
<!-- TopNavBar (Mobile Only Pivot) -->
<nav class="md:hidden flex flex-col bg-surface w-full max-w-full border-b border-outline-variant z-20">
<div class="flex justify-between items-center w-full px-margin-mobile h-14">
<div class="font-headline-md text-headline-md font-bold text-primary">Note Pin</div>
<div class="flex items-center gap-sm">
<button class="font-label-md text-label-md text-secondary px-md py-sm rounded hover:bg-surface-container-low transition-colors active:opacity-80 cursor-pointer">Cancel</button>
<button class="font-label-md text-label-md bg-primary text-on-primary px-md py-sm rounded hover:bg-on-primary-fixed-variant transition-colors active:opacity-80 cursor-pointer flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Create
                </button>
</div>
</div>
<div class="flex px-margin-mobile gap-lg overflow-x-auto no-scrollbar pt-sm">
<button class="font-label-md text-label-md text-secondary hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 pb-2 whitespace-nowrap">Records</button>
<button class="font-label-md text-label-md text-primary border-b-2 border-primary pb-2 hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 whitespace-nowrap">Editor</button>
<button class="font-label-md text-label-md text-secondary hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 pb-2 whitespace-nowrap">Insights</button>
</div>
</nav>
<!-- SideNavBar (Desktop Only) -->
<nav class="hidden md:flex flex-col h-full w-[320px] bg-surface-container-lowest border-r border-outline-variant py-lg px-md z-10 shrink-0">
<!-- Header -->
<div class="flex items-center gap-sm mb-xl px-sm">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-label-sm shrink-0">
                NP
            </div>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface leading-tight">Note Pin</h1>
<p class="font-label-sm text-label-sm text-secondary">Minimalist Utility</p>
</div>
</div>
<!-- CTA -->
<button class="w-full flex items-center justify-center gap-sm bg-primary text-on-primary font-label-md text-label-md rounded-lg py-sm px-md mb-xl hover:bg-on-primary-fixed-variant transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">add</span>
            New Note
        </button>
<!-- Main Navigation -->
<div class="flex flex-col gap-xs flex-1">
<a class="flex items-center gap-md px-sm py-sm font-label-md text-label-md text-secondary hover:bg-surface-container-high rounded-lg transition-all active:scale-[0.98] cursor-pointer group" href="#">
<span class="material-symbols-outlined text-[20px] group-hover:text-on-surface">list_alt</span>
<span class="group-hover:text-on-surface">Records</span>
</a>
<a class="flex items-center gap-md px-sm py-sm font-label-md text-label-md bg-secondary-container text-on-secondary-container rounded-lg font-bold transition-all active:scale-[0.98] cursor-pointer" href="#">
<span class="material-symbols-outlined text-[20px] icon-fill">edit_note</span>
<span>Editor</span>
</a>
<a class="flex items-center gap-md px-sm py-sm font-label-md text-label-md text-secondary hover:bg-surface-container-high rounded-lg transition-all active:scale-[0.98] cursor-pointer group" href="#">
<span class="material-symbols-outlined text-[20px] group-hover:text-on-surface">analytics</span>
<span class="group-hover:text-on-surface">Insights</span>
</a>
</div>
<!-- Footer Navigation -->
<div class="flex flex-col gap-xs pt-md border-t border-surface-variant mt-auto">
<a class="flex items-center gap-md px-sm py-sm font-label-md text-label-md text-secondary hover:bg-surface-container-high rounded-lg transition-all active:scale-[0.98] cursor-pointer group" href="#">
<span class="material-symbols-outlined text-[20px] group-hover:text-on-surface">settings</span>
<span class="group-hover:text-on-surface">Settings</span>
</a>
<a class="flex items-center gap-md px-sm py-sm font-label-md text-label-md text-secondary hover:bg-surface-container-high rounded-lg transition-all active:scale-[0.98] cursor-pointer group" href="#">
<span class="material-symbols-outlined text-[20px] group-hover:text-on-surface">help</span>
<span class="group-hover:text-on-surface">Support</span>
</a>
</div>
</nav>
<!-- Main Canvas: Record Editor -->
<main class="flex-1 flex flex-col h-full overflow-hidden bg-background relative">
<!-- Editor Header / Toolbar (Desktop) -->
<header class="hidden md:flex justify-between items-center px-margin-desktop py-md border-b border-surface-variant bg-surface shrink-0 h-16">
<div class="flex items-center gap-sm">
<!-- Status Indicator -->
<div class="flex items-center gap-2 px-sm py-xs bg-surface-container-low rounded-full">
<div class="w-2 h-2 rounded-full bg-[#F59E0B]"></div>
<span class="font-label-sm text-label-sm text-secondary">Unsaved changes</span>
</div>
</div>
<div class="flex items-center gap-md">
<button class="font-label-md text-label-md text-secondary bg-surface border border-outline-variant px-lg py-sm rounded hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">
                    Cancel
                </button>
<button class="font-label-md text-label-md text-on-primary bg-primary px-lg py-sm rounded hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-xs shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save Record
                </button>
</div>
</header>
<!-- Editor Content Area -->
<div class="flex-1 overflow-y-auto w-full flex flex-col items-center px-margin-mobile md:px-margin-desktop py-xl">
<div class="w-full max-w-3xl flex flex-col h-full gap-lg">
<!-- Title Input Group (with Validation Error State) -->
<div class="flex flex-col gap-xs group">
<input class="w-full bg-transparent border-b-2 border-error focus:border-error focus:outline-none focus:ring-0 font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface placeholder:text-outline-variant pb-xs transition-colors" placeholder="Note Title" type="text" value=""/>
<div class="flex items-center gap-xs text-error mt-1">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-sm text-label-sm">Title is required to save this record.</span>
</div>
</div>
<!-- Meta Details (Optional/Contextual) -->
<div class="flex items-center gap-lg border-b border-surface-variant pb-md">
<div class="flex items-center gap-xs text-secondary">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
<span class="font-label-sm text-label-sm">Created today</span>
</div>
<div class="flex items-center gap-xs text-secondary">
<span class="material-symbols-outlined text-[16px]">folder_open</span>
<span class="font-label-sm text-label-sm">No Category</span>
<span class="material-symbols-outlined text-[16px] cursor-pointer hover:text-primary transition-colors ml-xs">expand_more</span>
</div>
</div>
<!-- Content Textarea -->
<div class="flex-1 w-full relative group">
<textarea class="w-full h-full bg-transparent border-none focus:outline-none focus:ring-0 resize-none font-body-md text-body-md text-on-surface placeholder:text-outline-variant py-md leading-relaxed" placeholder="Start typing your note here...">Project kick-off notes:
- Need to finalize the design system tokens.
- Review the color contrast ratios for light mode.
- Schedule follow up with engineering regarding the structural layout of the main dashboard.

The overarching goal is utilitarian minimalism. Keep the UI out of the way. Let the content breathe.</textarea>
<!-- Floating Action Button (Mobile Contextual Save - visible only when scrolling or keyboard active on mobile) -->
<button class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:bg-on-primary-fixed-variant transition-transform active:scale-95 z-30">
<span class="material-symbols-outlined text-[24px]">save</span>
</button>
</div>
</div>
</div>
</main>
</body></html>
